# .github/workflows/ci.yml
name: CI - SOS Rota

# Define quando o workflow é acionado
on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'hotfix/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - develop

# Jobs rodam em paralelo por padrão
jobs:
  # JOB 1: Backend Spring Boot
  build-backend:
    name: 'Build Backend (Spring Boot + Java 21)'
    runs-on: ubuntu-latest
    steps:
      # Baixar o código do branch atual
      - name: 'Checkout do codigo'
        uses: actions/checkout@v4

      # Instalar o Java 21 na VM
      # cache: maven salva as dependencias entre runs
      - name: 'Configurar Java 21'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compilar e rodar testes
      # mvn verify: compila + testa + valida o artefato
      # --no-transfer-progress: reduz o log de download
      - name: 'Build e testes com Maven'
        run: cd backend && mvn verify --no-transfer-progress

  # JOB 2: Frontend Angular
  build-frontend:
    name: 'Build Frontend (Angular + Node 20)'
    runs-on: ubuntu-latest
    steps:
      # Baixar o código
      - name: 'Checkout do codigo'
        uses: actions/checkout@v4

      # Instalar o Node.js 20
      # cache: npm acelera a instalação de dependências
      - name: 'Configurar Node.js 20'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Instalar dependências de forma determinística
      # npm ci: usa package-lock.json (mais seguro que npm install em CI)
      - name: 'Instalar dependencias (npm ci)'
        run: cd frontend && npm ci

      # Compilar o Angular para produção
      # Falha se houver erro de TypeScript ou importação errada
      - name: 'Build Angular (prod)'
        run: cd frontend && npm run build
