<div class="login-container">
  <div class="login-box">
    <div class="login-logo">🚑 SOS Rota</div>
    <div class="login-header">
      <h1>Login</h1>
      <p>Entre com suas credenciais para acessar o sistema</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      @if (mensagem) {
        <div class="form-alert" [class.form-alert-success]="mensagem.tipo==='success'" [class.form-alert-error]="mensagem.tipo==='error'">
          {{ mensagem.texto }}
        </div>
      }
      <div class="form-group">
        <label for="username">Usuário</label>
        <input id="username" type="text" formControlName="username" placeholder="Digite seu usuário"
          [class.input-error]="temErro('username')" autocomplete="username" />
        @if (temErro('username')) { <span class="error-text">{{ erroMsg('username') }}</span> }
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input id="password" type="password" formControlName="password" placeholder="Digite sua senha"
          [class.input-error]="temErro('password')" autocomplete="current-password" />
        @if (temErro('password')) { <span class="error-text">{{ erroMsg('password') }}</span> }
      </div>
      <button type="submit" class="btn-login" [disabled]="carregando">
        @if (carregando) { <span class="spinner-sm"></span> Aguarde... } @else { Entrar }
      </button>
    </form>
    <div class="login-footer">
      <p>Não tem conta? <a routerLink="/register">Cadastre-se aqui</a></p>
    </div>
  </div>
</div>
