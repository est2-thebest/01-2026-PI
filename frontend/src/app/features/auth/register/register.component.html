<div class="login-container">
  <div class="login-box">
    <div class="login-logo">🚑 SOS Rota</div>
    <div class="login-header"><h1>Cadastro</h1><p>Crie sua conta para acessar o sistema</p></div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      @if (mensagem) {
        <div class="form-alert" [class.form-alert-success]="mensagem.tipo==='success'" [class.form-alert-error]="mensagem.tipo==='error'">
          {{ mensagem.texto }}
        </div>
      }
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" formControlName="username" placeholder="Nome de usuário" [class.input-error]="temErro('username')" />
        @if (temErro('username')) { <span class="error-text">{{ erroMsg('username') }}</span> }
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" formControlName="email" placeholder="seu@email.com" [class.input-error]="temErro('email')" />
        @if (temErro('email')) { <span class="error-text">{{ erroMsg('email') }}</span> }
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" formControlName="password" placeholder="Mínimo 6 caracteres" [class.input-error]="temErro('password')" />
        @if (temErro('password')) { <span class="error-text">{{ erroMsg('password') }}</span> }
      </div>
      <button type="submit" class="btn-login" [disabled]="carregando">
        @if (carregando) { <span class="spinner-sm"></span> Aguarde... } @else { Cadastrar }
      </button>
    </form>
    <div class="login-footer"><p>Já tem conta? <a routerLink="/login">Faça login aqui</a></p></div>
  </div>
</div>
